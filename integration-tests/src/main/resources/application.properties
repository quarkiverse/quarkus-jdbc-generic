quarkus.datasource.db-kind=generic
# build-time visible driver and URL: the application is built against MySQL and repointed to H2 at
# runtime through the QUARKUS_DATASOURCE_JDBC_GENERIC_DRIVER and QUARKUS_DATASOURCE_JDBC_URL
# environment variables (see the surefire configuration of this module), mimicking a single image
# switched per environment
quarkus.datasource.jdbc-generic.driver=com.mysql.cj.jdbc.Driver
quarkus.datasource.jdbc.url=jdbc:mysql://build-time-host:3306/ignored
